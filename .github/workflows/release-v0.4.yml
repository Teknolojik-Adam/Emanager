name: Publish Emanager Linux V0.4 ZIP

on:
  push:
    branches: [linux]
    paths: ['.github/workflows/release-v0.4.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Linux branch
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Linux x64
        run: dotnet publish src/Emanager.App/Emanager.App.csproj -c Release -r linux-x64 --self-contained false -o staging/Emanager-Linux-V0.4/app --nologo
      - name: Package application
        run: |
          cat > staging/Emanager-Linux-V0.4/emanager <<'EOF'
          #!/bin/sh
          set -eu
          DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec dotnet "$DIR/app/Emanager.App.dll" "$@"
          EOF
          chmod +x staging/Emanager-Linux-V0.4/emanager
          cp LICENSE.txt staging/Emanager-Linux-V0.4/LICENSE.txt
          cat > staging/Emanager-Linux-V0.4/README.txt <<'EOF'
          Emanager Linux V0.4 (Linux x86_64, .NET 8 runtime required)
          Run: ./emanager
          Source: https://github.com/Teknolojik-Adam/Emanager/tree/linux
          License: AGPL-3.0 (LICENSE.txt)
          EOF
          cd staging
          zip -qr ../Emanager-Linux-V0.4-linux-x64.zip Emanager-Linux-V0.4
      - name: Publish V0.4 release with ZIP asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create V0.4 Emanager-Linux-V0.4-linux-x64.zip \
            --target "${{ github.sha }}" \
            --title "Emanager Linux V0.4" \
            --notes "First Linux release of Emanager, built with Avalonia and .NET 8. Download the Linux x64 ZIP, extract it, and run ./emanager. Requires the .NET 8 runtime. Windows remains on master." \
            --latest
